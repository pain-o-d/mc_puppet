modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"
issueTrackerURL = "https://github.com/pain-o-d/mc_puppet/issues"

[[mods]]
modId = "mc_puppet"
version = "${version}"
displayName = "MC Puppet"
authors = "pain_o_d"
displayURL = "https://github.com/pain-o-d/mc_puppet"
description = '''
Lets a program on the same machine see and drive a running game - screens, widgets, slots, clicks, screenshots, commands, world state - so mods can be tested without a person at the keyboard. Off by default, loopback only, token protected. Ships with an MCP server for AI coding agents.
'''

[[dependencies.mc_puppet]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.mc_puppet]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,1.20.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.mc_puppet]]
modId = "architectury"
mandatory = true
versionRange = "[9.2.14,)"
ordering = "AFTER"
side = "BOTH"
